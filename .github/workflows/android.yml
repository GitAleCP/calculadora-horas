name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código
      uses: actions/checkout@v4
      
    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Instalar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Instalar Cordova
      run: npm install -g cordova
      
    - name: Instalar Android SDK 34
      run: |
        # Instalar sdkmanager
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip
        
        # Aceptar licencias e instalar SDK 34
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        
    - name: Crear proyecto Cordova
      run: |
        cordova create myapp com.calculadora.horas "Calculadora Horas"
        
    - name: Copiar archivos a www
      run: |
        rm -rf myapp/www/*
        cp -v index.html myapp/www/
        cp -v styles.css myapp/www/
        cp -v app.js myapp/www/
        echo "=== Archivos en www ==="
        ls -la myapp/www/
        
    - name: Copiar config.xml
      run: |
        cp -v config.xml myapp/
        echo "=== config.xml copiado ==="
        
    - name: Agregar plataforma Android
      run: |
        cd myapp
        cordova platform add android@latest
        
    - name: Preparar build
      run: |
        cd myapp
        cordova prepare android
        
    - name: Compilar APK Debug
      run: |
        cd myapp
        echo "Iniciando compilación..."
        cordova build android --debug
        echo "Compilación completada"
        
    - name: Verificar APK generado
      run: |
        echo "=== Buscando APK ==="
        find myapp -name "*.apk" -type f
        ls -la myapp/platforms/android/app/build/outputs/apk/debug/
        
    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: calculadora-horas-apk
        path: myapp/platforms/android/app/build/outputs/apk/debug/
        retention-days: 30
        
    - name: Resumen
      run: |
        echo "✅ Build completado!"
        echo "📱 APK disponible en Artifacts"
